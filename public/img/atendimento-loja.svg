<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="Atendimento no balcão de uma loja de autopeças: atendente e cliente com prateleiras de peças ao fundo">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dce8f8"/></linearGradient>
  </defs>
  <rect width="520" height="380" rx="20" fill="url(#wall)"/>
  <!-- placa -->
  <rect x="150" y="22" width="220" height="40" rx="8" fill="#0d3b7a"/>
  <text x="260" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#fff" letter-spacing="1">AUTOPEÇAS</text>
  <!-- prateleiras -->
  <g>
    <rect x="30" y="80" width="460" height="170" rx="6" fill="#c9cfd8"/>
    <g fill="#7a8494"><rect x="30" y="134" width="460" height="6"/><rect x="30" y="190" width="460" height="6"/></g>
    <!-- caixas e peças -->
    <g>
      <rect x="44" y="96" width="44" height="38" rx="3" fill="#1a62c4"/><rect x="92" y="104" width="36" height="30" rx="3" fill="#fff"/><rect x="132" y="92" width="40" height="42" rx="3" fill="#1250a3"/>
      <circle cx="200" cy="114" r="18" fill="#9aa3b1" stroke="#5a6474" stroke-width="3"/><circle cx="200" cy="114" r="6" fill="#5a6474"/>
      <rect x="232" y="98" width="30" height="36" rx="3" fill="#fff"/><rect x="268" y="98" width="30" height="36" rx="3" fill="#fff"/>
      <rect x="306" y="94" width="48" height="40" rx="3" fill="#0d3b7a"/><rect x="360" y="104" width="34" height="30" rx="3" fill="#1a62c4"/>
      <rect x="400" y="96" width="34" height="38" rx="10" fill="#1250a3"/><rect x="440" y="100" width="36" height="34" rx="3" fill="#fff"/>
      <rect x="44" y="150" width="60" height="40" rx="3" fill="#fff"/><rect x="110" y="156" width="40" height="34" rx="3" fill="#1a62c4"/>
      <g transform="translate(160 150)"><rect x="6" y="0" width="10" height="40" rx="3" fill="#3d4756"/><path d="M0 6l22 6-22 6 22 6-22 6" stroke="#e1e5eb" stroke-width="4" fill="none"/></g>
      <rect x="196" y="152" width="52" height="38" rx="3" fill="#0d3b7a"/><rect x="254" y="160" width="40" height="30" rx="3" fill="#fff"/>
      <circle cx="320" cy="170" r="18" fill="#c9cfd8" stroke="#7a8494" stroke-width="4"/><rect x="346" y="150" width="44" height="40" rx="3" fill="#1a62c4"/>
      <rect x="396" y="158" width="38" height="32" rx="3" fill="#fff"/><rect x="440" y="150" width="36" height="40" rx="3" fill="#1250a3"/>
      <rect x="44" y="206" width="48" height="40" rx="3" fill="#1a62c4"/><rect x="98" y="212" width="46" height="34" rx="3" fill="#fff"/><rect x="150" y="204" width="40" height="42" rx="3" fill="#0d3b7a"/>
      <rect x="380" y="208" width="44" height="38" rx="3" fill="#fff"/><rect x="430" y="204" width="46" height="42" rx="3" fill="#1a62c4"/>
    </g>
  </g>
  <!-- atendente -->
  <g transform="translate(150 170)">
    <circle cx="40" cy="34" r="26" fill="#a66a45"/>
    <path d="M14 30c0-20 14-30 28-30s26 10 26 28c-8-8-22-12-36-10-8 1-14 6-18 12z" fill="#2b1d14"/>
    <path d="M0 140c0-46 18-72 40-72s40 26 40 72z" fill="#1250a3"/>
    <path d="M30 70l10 16 10-16" fill="#fff"/>
    <rect x="52" y="96" width="18" height="10" rx="2" fill="#fff"/>
  </g>
  <!-- cliente -->
  <g transform="translate(330 168)">
    <circle cx="40" cy="36" r="26" fill="#f0c7a0"/>
    <path d="M14 34c-2-24 14-34 28-34 16 0 28 12 26 30-10-12-34-14-54 4z" fill="#7a4b26"/>
    <path d="M0 144c0-48 18-74 40-74s40 26 40 74z" fill="#5a6474"/>
  </g>
  <!-- balcão -->
  <rect x="20" y="282" width="480" height="78" rx="8" fill="#0d3b7a"/>
  <rect x="20" y="272" width="480" height="16" rx="6" fill="#1a62c4"/>
  <!-- peça no balcão + computador -->
  <g transform="translate(250 236)"><circle cx="20" cy="20" r="20" fill="#c9cfd8" stroke="#5a6474" stroke-width="4"/><circle cx="20" cy="20" r="7" fill="#5a6474"/></g>
  <g transform="translate(60 226)"><rect x="0" y="0" width="62" height="42" rx="4" fill="#1d2430"/><rect x="5" y="5" width="52" height="30" rx="2" fill="#5b9bf0"/><rect x="24" y="42" width="14" height="6" fill="#3d4756"/></g>
  <text x="260" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#dce8f8" letter-spacing="2">ATENDIMENTO ESPECIALIZADO</text>
</svg>
