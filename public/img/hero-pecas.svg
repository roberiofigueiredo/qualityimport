    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5b9bf0" stop-opacity=".45"/><stop offset="1" stop-color="#5b9bf0" stop-opacity="0"/></radialGradient>
